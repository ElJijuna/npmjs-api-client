name: Verify package

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: mkdir -p package-artifact && npm pack --ignore-scripts --pack-destination package-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: verified-package
          path: package-artifact/*.tgz

  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-package
          path: package-artifact
      - run: node scripts/test-package.mjs package-artifact/*.tgz
